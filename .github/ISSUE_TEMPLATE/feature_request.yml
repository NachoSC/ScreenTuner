name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, rather than a proposed solution - it often has a simpler answer.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I checked the README, including the Roadmap and Gotchas sections
          required: true
